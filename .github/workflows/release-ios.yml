name: Release

# Triggered automatically by pushing a `v*` tag (e.g. `v4.4.0`).
# Also runnable manually via `gh workflow run release-ios.yml --ref <tag>`.
#
# Publish order matters: UseSenseSDK now depends on UseSenseMediaPipe (the
# vendored, Info.plist-patched MediaPipe frameworks), and UseSenseMediaPipe's
# podspec downloads its binaries from THIS tag's GitHub Release. So the pipeline
# is strictly sequenced:
#   vendor-mediapipe + build-xcframework  ->  create-release (attaches both zips)
#     ->  publish-mediapipe (pod trunk push)  ->  publish-sdk (pod trunk push)
# Each `pod trunk push` lints first, so a misconfiguration FAILS the release
# rather than publishing a broken pod.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-mediapipe:
    name: Build patched MediaPipe bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Vendor + patch MediaPipe xcframeworks
        run: bash scripts/vendor-mediapipe.sh "$PWD/build/mediapipe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UseSenseMediaPipe-xcframeworks
          path: build/mediapipe/UseSenseMediaPipe.xcframeworks.zip

  build-xcframework:
    name: Build XCFramework
    runs-on: macos-15
    # The XCFramework attached to the GitHub Release is built from a dedicated
    # Xcode framework target (XCFrameworkBuild/project.yml) generated via
    # xcodegen at CI time. See that file for why the SwiftPM product can't be
    # archived into a consumable .framework directly.
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate wrapper Xcode project
        run: |
          cd XCFrameworkBuild
          xcodegen generate

      - name: Archive for iOS device
        run: |
          xcodebuild archive \
            -project XCFrameworkBuild/UseSenseSDK.xcodeproj \
            -scheme UseSenseSDK \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive for iOS Simulator
        run: |
          xcodebuild archive \
            -project XCFrameworkBuild/UseSenseSDK.xcodeproj \
            -scheme UseSenseSDK \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath build/sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Create XCFramework
        run: |
          DEVICE_FW=build/ios.xcarchive/Products/Library/Frameworks/UseSenseSDK.framework
          SIM_FW=build/sim.xcarchive/Products/Library/Frameworks/UseSenseSDK.framework

          if [ ! -d "$DEVICE_FW" ] || [ ! -d "$SIM_FW" ]; then
            echo "ERROR: Framework not found at expected archive path."
            echo "Device: $DEVICE_FW ($(if [ -d "$DEVICE_FW" ]; then echo ok; else echo missing; fi))"
            echo "Sim:    $SIM_FW ($(if [ -d "$SIM_FW" ]; then echo ok; else echo missing; fi))"
            find build -name 'UseSenseSDK*' -type d 2>/dev/null
            exit 1
          fi

          xcodebuild -create-xcframework \
            -framework "$DEVICE_FW" \
            -framework "$SIM_FW" \
            -output build/UseSenseSDK.xcframework

      - name: Zip XCFramework
        run: |
          cd build
          zip -r UseSenseSDK.xcframework.zip UseSenseSDK.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UseSenseSDK-xcframework
          path: build/UseSenseSDK.xcframework.zip

  create-release:
    name: Create GitHub Release
    runs-on: macos-15
    needs: [vendor-mediapipe, build-xcframework]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download SDK XCFramework
        uses: actions/download-artifact@v4
        with:
          name: UseSenseSDK-xcframework
          path: build/
      - name: Download patched MediaPipe bundle
        uses: actions/download-artifact@v4
        with:
          name: UseSenseMediaPipe-xcframeworks
          path: build/
      - name: Create Release
        # UseSenseMediaPipe.podspec downloads its binaries from this asset, so the
        # release MUST exist before the CocoaPods publish jobs run.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/UseSenseSDK.xcframework.zip
            build/UseSenseMediaPipe.xcframeworks.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mediapipe:
    name: Publish UseSenseMediaPipe to CocoaPods
    runs-on: macos-15
    needs: create-release
    # Must publish before UseSenseSDK, which declares it as a dependency.
    steps:
      - uses: actions/checkout@v4
      - name: Push UseSenseMediaPipe to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push UseSenseMediaPipe.podspec --allow-warnings

  publish-sdk:
    name: Publish UseSenseSDK to CocoaPods
    runs-on: macos-15
    needs: publish-mediapipe
    steps:
      - uses: actions/checkout@v4
      - name: Push UseSenseSDK to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push UseSenseSDK.podspec --allow-warnings
