name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate Podspec
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Lint podspec
        run: pod lib lint UseSenseSDK.podspec --allow-warnings

  build-xcframework:
    name: Build XCFramework
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS device
        run: |
          xcodebuild build \
            -scheme UseSenseSDK \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme UseSenseSDK \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Locate frameworks and create XCFramework
        run: |
          DEVICE_FW="build/DerivedData/Build/Products/Release-iphoneos/UseSenseSDK.framework"
          SIM_FW="build/DerivedData/Build/Products/Release-iphonesimulator/UseSenseSDK.framework"

          echo "Looking for frameworks..."
          echo "Device: $DEVICE_FW (exists: $(test -d "$DEVICE_FW" && echo yes || echo no))"
          echo "Simulator: $SIM_FW (exists: $(test -d "$SIM_FW" && echo yes || echo no))"

          # Fallback: search if not at expected path
          if [ ! -d "$DEVICE_FW" ]; then
            echo "Searching for device framework..."
            DEVICE_FW=$(find build -name 'UseSenseSDK.framework' -path '*Release-iphoneos*' -type d | head -1)
            echo "Found: $DEVICE_FW"
          fi
          if [ ! -d "$SIM_FW" ]; then
            echo "Searching for simulator framework..."
            SIM_FW=$(find build -name 'UseSenseSDK.framework' -path '*Release-iphonesimulator*' -type d | head -1)
            echo "Found: $SIM_FW"
          fi

          if [ -z "$DEVICE_FW" ] || [ -z "$SIM_FW" ]; then
            echo "ERROR: Could not find frameworks. Directory listing:"
            find build -name '*.framework' -type d 2>/dev/null || echo "No frameworks found"
            find build/DerivedData/Build/Products -type d -maxdepth 3 2>/dev/null || echo "No products found"
            exit 1
          fi

          xcodebuild -create-xcframework \
            -framework "$DEVICE_FW" \
            -framework "$SIM_FW" \
            -output build/UseSenseSDK.xcframework

      - name: Zip XCFramework
        run: |
          cd build
          zip -r UseSenseSDK.xcframework.zip UseSenseSDK.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UseSenseSDK-xcframework
          path: build/UseSenseSDK.xcframework.zip

  publish-cocoapods:
    name: Publish to CocoaPods
    runs-on: macos-15
    needs: validate
    steps:
      - uses: actions/checkout@v4

      # Requires COCOAPODS_TRUNK_TOKEN secret configured in repository settings.
      # Generate a token with: pod trunk register <email> '<name>'
      - name: Push to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push UseSenseSDK.podspec --allow-warnings

  create-release:
    name: Create GitHub Release
    runs-on: macos-15
    needs: build-xcframework
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: UseSenseSDK-xcframework
          path: build/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/UseSenseSDK.xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
