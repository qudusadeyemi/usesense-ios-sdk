name: Release

# Triggered automatically by pushing a `v*` tag (e.g. `v4.2.0`).
# Also runnable manually via `gh workflow run release-ios.yml --ref <tag>`
# or the "Run workflow" button in the Actions tab — useful for re-running
# a release after a transient CI flake without re-tagging the commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate Podspec
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Lint podspec
        run: pod lib lint UseSenseSDK.podspec --allow-warnings

  build-xcframework:
    name: Build XCFramework
    runs-on: macos-15
    needs: validate
    # The XCFramework attached to the GitHub Release is built from a
    # dedicated Xcode framework target defined in XCFrameworkBuild/project.yml
    # and generated at CI time via xcodegen, rather than from the SwiftPM
    # package directly.
    #
    # Why: `xcodebuild archive` over a SwiftPM static library product only
    # emits the compiled binary and a sibling resource bundle; the resulting
    # `UseSenseSDK.framework` has no Modules/ or Info.plist, so consumers
    # cannot `import UseSenseSDK` or runtime-load the framework. Flipping the
    # SPM product to `.library(type: .dynamic, ...)` produces a binary but
    # still doesn't populate Modules/, so it's not a workaround either.
    #
    # The wrapper project compiles the same Swift sources under
    # Sources/UseSense/** as a proper Xcode framework target, so Xcode
    # generates a complete .framework bundle (Headers, Modules/swiftmodule,
    # Info.plist, flat resources) that is actually consumable by drag-in
    # integrators. See XCFrameworkBuild/project.yml for details.
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate wrapper Xcode project
        run: |
          cd XCFrameworkBuild
          xcodegen generate

      - name: Archive for iOS device
        run: |
          xcodebuild archive \
            -project XCFrameworkBuild/UseSenseSDK.xcodeproj \
            -scheme UseSenseSDK \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive for iOS Simulator
        run: |
          xcodebuild archive \
            -project XCFrameworkBuild/UseSenseSDK.xcodeproj \
            -scheme UseSenseSDK \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -archivePath build/sim.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Create XCFramework
        run: |
          DEVICE_FW=build/ios.xcarchive/Products/Library/Frameworks/UseSenseSDK.framework
          SIM_FW=build/sim.xcarchive/Products/Library/Frameworks/UseSenseSDK.framework

          if [ ! -d "$DEVICE_FW" ] || [ ! -d "$SIM_FW" ]; then
            echo "ERROR: Framework not found at expected archive path."
            echo "Device: $DEVICE_FW ($(if [ -d "$DEVICE_FW" ]; then echo ok; else echo missing; fi))"
            echo "Sim:    $SIM_FW ($(if [ -d "$SIM_FW" ]; then echo ok; else echo missing; fi))"
            find build -name 'UseSenseSDK*' -type d 2>/dev/null
            exit 1
          fi

          xcodebuild -create-xcframework \
            -framework "$DEVICE_FW" \
            -framework "$SIM_FW" \
            -output build/UseSenseSDK.xcframework

      - name: Zip XCFramework
        run: |
          cd build
          zip -r UseSenseSDK.xcframework.zip UseSenseSDK.xcframework

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UseSenseSDK-xcframework
          path: build/UseSenseSDK.xcframework.zip

  publish-cocoapods:
    name: Publish to CocoaPods
    runs-on: macos-15
    needs: validate
    # Note: this job used to have
    #   if: ${{ secrets.COCOAPODS_TRUNK_TOKEN != '' }}
    # as a "graceful skip when token is missing" guard. That conditional
    # is invalid at the job level — the `secrets` context is not in
    # scope during workflow plan evaluation, so the expression errors
    # out at startup and the ENTIRE workflow fails with `jobs: []`
    # (zero jobs scheduled). Every release-ios.yml run since the
    # conditional was added failed in 0s for this reason — the run
    # appears in the Actions tab but no jobs ever materialise.
    #
    # COCOAPODS_TRUNK_TOKEN is now a required repo secret. If it
    # isn't set when the workflow fires, the `pod trunk push` step
    # below fails with a clear authentication error and the deploy
    # can be retried via `gh workflow run release-ios.yml --ref <tag>`
    # after adding the secret.
    steps:
      - uses: actions/checkout@v4

      - name: Push to CocoaPods Trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push UseSenseSDK.podspec --allow-warnings

  create-release:
    name: Create GitHub Release
    runs-on: macos-15
    needs: build-xcframework
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: UseSenseSDK-xcframework
          path: build/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/UseSenseSDK.xcframework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
